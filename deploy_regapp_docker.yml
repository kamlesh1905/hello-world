---
- hosts: docker

  tasks:
  - name: stop container
    command: docker stop registerapp
    ignore_errors: yes

  - name: remove container
    command: docker rm registerapp
    ignore_errors: yes

  - name: remove image
    command: docker rmi kamleshmerugu/gitmavendeploypublishsshansibleecpipeline:latest
    ignore_errors: yes

  - name: create container
    command: docker run -d --name registerapp -p 8080:8080 kamleshmerugu/gitmavendeploypublishsshansibleecpipeline:latest
    ignore_errors: yes
